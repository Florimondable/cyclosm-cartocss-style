name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Kosmtik
        run: |
          git clone https://github.com/kosmtik/kosmtik
          cd kosmtik
          npm install
          cd ..
      - name: Benchmark CartoCSS
        run: |
          ./kosmtik/node_modules/.bin/carto -b project.mml -f mapnik.xml 2>&1 | grep -v Warning:
      - name: Inspect Mapnik XML
        run: |
          pip install --break-system-packages prettytable
          ./kosmtik/node_modules/.bin/carto project.mml -f mapnik.xml
          python3 scripts/inspect_mapnik_xml.py mapnik.xml
      - name: Rendering complexity benchmark
        run: |
          python3 scripts/benchmark_compilation.py mapnik.xml --json perf_results.json
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: rendering-complexity
          path: perf_results.json
      - name: Non-regression test
        run: |
          python3 scripts/test_non_regression.py mapnik.xml \
            --baseline scripts/perf_baseline.json
      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: scripts/perf_baseline.json
